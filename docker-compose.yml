services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: phishx-server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: phishx-client
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped
