name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: CI (Client + API + ML)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: npm ci

      - name: Install ML Dependencies
        run: pip install -r MLPipeline/requirements.txt

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: API Smoke Tests
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/phishx_ci
          JWT_ACCESS_SECRET: ci-access-secret
          JWT_REFRESH_SECRET: ci-refresh-secret
          ADMIN_EMAIL: admin@phishx.local
          ADMIN_PASSWORD: ChangeMeStrong123!
        run: npm run test:api

      - name: ML Pipeline Smoke
        run: python MLPipeline/scripts/retrain_all.py

  cd:
    name: CD (Build Artifact)
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Client Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
